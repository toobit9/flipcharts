        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .aspect-wrapper {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .screen {
            position: relative;
            width: min(100vw, 177.78vh);
            height: min(100vh, 56.25vw);
            background: linear-gradient(135deg, #0a1628, #1a2f4e);
            overflow: hidden;
        }

        .slideshow { width: 100%; height: 100%; position: relative; }

        .slide { display: none; position: absolute; inset: 0; }
        .slide.active { display: flex; flex-direction: column; }

        .slide-bg {
            position: absolute; inset: 0;
            background-size: cover;
            background-position: center;
            filter: brightness(0.45);
            z-index: 0;
        }

        .slide-content {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100%;
            padding: 40px 60px 100px;
            text-align: center;
        }

        .slide-section {
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(212,175,55,0.7);
            margin-bottom: 24px;
        }

        .slide-line {
            font-size: clamp(1.8rem, 5.5vw, 3.2rem);
            font-weight: 700;
            color: #ffffff;
            line-height: 1.5;
            text-shadow: 0 3px 25px rgba(0,0,0,0.9), 0 1px 8px rgba(0,0,50,1);
            max-width: 850px;
        }

        .slide-line.keywords {
            font-size: clamp(2.4rem, 8vw, 5rem);
            color: #ffd93d;
        }

        .title-main {
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 4px 30px rgba(0,0,0,0.9);
            margin-bottom: 16px;
        }
        .title-sub {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: rgba(255,255,255,0.65);
            letter-spacing: 2px;
        }

        /* Nav */
        .nav {
            position: fixed; bottom: 0;
            left: 50%; transform: translateX(-50%);
            width: min(100vw, 177.78vh);
            z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 24px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }

        .nav-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            color: white; padding: 10px 32px;
            border-radius: 30px; font-size: 1.1rem;
            cursor: pointer; transition: all 0.2s;
            font-family: Georgia, serif;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-btn:active { background: rgba(255,255,255,0.35); transform: scale(0.97); }
        .nav-btn:disabled { opacity: 0.25; cursor: default; }
        .nav-counter { color: rgba(255,255,255,0.6); font-size: 0.9rem; }

        /* Mode toggle */
        .mode-toggle {
            position: fixed; top: 14px;
            right: calc(50% - min(50vw, 88.89vh) + 14px);
            z-index: 100; display: flex; gap: 8px;
        }
        .mode-btn {
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.3);
            color: white; width: 36px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
            border-radius: 20px; font-size: 0.95rem;
            cursor: pointer; transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .mode-btn.active { background: #d4af37; color: #000; border-color: #d4af37; font-weight: 600; }

        /* Jump nav */
        .jump-nav {
            position: fixed; top: 14px;
            left: calc(50% - min(50vw, 88.89vh) + 14px);
            z-index: 100; display: flex; gap: 6px;
        }
        .jump-btn {
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.3);
            color: white; width: 34px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
            border-radius: 20px; font-size: 0.95rem;
            cursor: pointer; transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        .jump-btn:hover { background: rgba(255,255,255,0.2); }
        .jump-btn.home-btn { background: rgba(212,175,55,0.3); border-color: #d4af37; color: #d4af37; }





        /* iPad teaching controls */
        .jump-nav,
        .mode-toggle { opacity: 0.62; transition: opacity 0.2s ease; }
        .jump-nav:hover,
        .jump-nav:focus-within,
        .mode-toggle:hover,
        .mode-toggle:focus-within { opacity: 0.95; }
        .jump-btn,
        .mode-btn { touch-action: manipulation; }
        @media (pointer: coarse) {
            .jump-nav,
            .mode-toggle { opacity: 0.7; }
            .jump-btn { width: 40px; height: 36px; font-size: 1rem; }
            .mode-btn { width: 42px; height: 36px; font-size: 1rem; }
        }

        /* Photo mode */
        #slideshow.photo-mode .slide-line,
        #slideshow.photo-mode .slide-section,
        #slideshow.photo-mode .title-main,
        #slideshow.photo-mode .title-sub { opacity: 0 !important; transition: opacity 0.3s; }
        #slideshow.photo-mode .slide-bg { filter: brightness(0.85) !important; }
        .progress-bar {

            transition: width 0.3s ease; z-index: 200;
            max-width: min(100vw, 177.78vh);
        }

        @media (max-width: 768px) {
            .slide-content { padding: 30px 30px 90px; }
            .slide-line { font-size: clamp(1.5rem, 6.5vw, 2.5rem); }
            .nav-btn { padding: 10px 24px; font-size: 1rem; }
        }

        .nav-btn.hidden { visibility: hidden; pointer-events: none; }
        .nav-btn.icon-btn { width: 44px; height: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 1rem; line-height: 1; }
        .nav-btn.stop-music { background: rgba(255,217,61,0.22); border-color: rgba(255,217,61,0.75); color: #ffd93d; }
        .gameshow-intro { position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center; background: radial-gradient(circle at top, rgba(255,217,61,0.24), transparent 34%), linear-gradient(135deg, #110600, #2d1000 58%, #090301); overflow: hidden; }
        .gameshow-intro.active { display: flex; }
        .gameshow-panel { width: min(84vw, 900px); text-align: center; padding: 44px 32px 52px; border: 2px solid rgba(255,217,61,0.48); background: rgba(0,0,0,0.36); box-shadow: 0 0 80px rgba(255,107,53,0.18), inset 0 0 48px rgba(255,217,61,0.08); }
        .gameshow-kicker { color: #ffd93d; font-family: Georgia, serif; font-size: clamp(0.95rem, 2vw, 1.35rem); letter-spacing: 6px; text-transform: uppercase; margin-bottom: 16px; }
        .gameshow-logo { color: #fff; font-size: clamp(3.6rem, 10vw, 8rem); line-height: 0.95; text-transform: uppercase; text-shadow: 0 4px 0 #8f2c09, 0 0 36px rgba(255,217,61,0.46); }
        .gameshow-song { margin-top: 18px; color: rgba(255,255,255,0.78); font-family: Georgia, serif; font-size: clamp(1rem, 2.6vw, 1.55rem); letter-spacing: 1px; }
        .gameshow-theme-btn { margin-top: 26px; background: #ffd93d; border: 0; color: #180900; width: 54px; height: 54px; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-size: 1.35rem; font-weight: 700; cursor: pointer; box-shadow: 0 8px 26px rgba(0,0,0,0.26); -webkit-tap-highlight-color: transparent; }

</style>

    function updateSlideContent() { slides.forEach(slide => { const el = slide.querySelector('.slide-line'); if (!el) return; const full = slide.dataset.full; const key = slide.dataset.key; if (!full) return; if (mode === 'full') { el.classList.remove('keywords', 'guess-mode'); el.innerHTML = full; } else if (mode === 'guess') { el.classList.remove('keywords'); el.classList.add('guess-mode'); const keyWords = new Set((key || '').toUpperCase().split(/[\s·]+/).filter(w => w.replace(/[^A-Z]/g,'').length > 2)); el.innerHTML = full.split(' ').map(w => { const clean = w.replace(/[^a-zA-Z0-9']/g, '').toUpperCase(); if (keyWords.has(clean)) { const width = Math.max(clean.length * 16, 40); return '<span style="display:inline-block;border-bottom:3px solid rgba(255,255,255,0.85);min-width:' + width + 'px;margin:0 3px;vertical-align:bottom;height:1.1em;"></span>'; } return w; }).join(' '); } else if (mode === 'keywords') { el.classList.add('keywords'); el.classList.remove('guess-mode'); el.textContent = key || full; } else { el.classList.remove('keywords', 'guess-mode'); el.innerHTML = full; } }); }
    function changeSlide(dir) { if (gameShow.active) { advanceGameShow(); return; } slides[current].classList.remove('active'); current = Math.max(0, Math.min(total - 1, current + dir)); slides[current].classList.add('active'); updateNav(); }
    function changeSlideAbsolute(idx) { if (gameShow.active && idx === 0) { initGameShow(); return; } slides[current].classList.remove('active'); current = idx; slides[current].classList.add('active'); updateNav(); }
    function shuffle(values) { const arr = values.slice(); for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
    function setActiveSlide(idx) { slides[current].classList.remove('active'); current = idx; slides[current].classList.add('active'); }
    function stopGameShowCue() { if (!gameShowAudio) return; gameShowAudio.pause(); gameShowAudio.currentTime = 0; gameShowAudio = null; }
    function playGameShowCue(name, options = {}) { const src = gameShowAudioFiles[name]; if (!src) return; stopGameShowCue(); const cue = new Audio(src); cue.volume = options.volume ?? 0.55; cue.loop = Boolean(options.loop); gameShowAudio = cue; cue.play().catch(() => {}); }
    function setGameShowIntroText(kicker, logo, song) { const intro = document.getElementById('gameshowIntro'); if (!intro) return; intro.querySelector('.gameshow-kicker').textContent = kicker; intro.querySelector('.gameshow-logo').textContent = logo; intro.querySelector('.gameshow-song').textContent = song; }
    function getSongTitle() { return document.querySelector('.title-main')?.textContent?.trim() || document.title.replace(/[-—].*$/, '').trim() || 'Primary Song'; }
    function initGameShow() { gameShow.active = true; gameShow.intro = true; gameShow.complete = false; gameShow.showingClue = false; gameShow.showingAnswer = false; gameShow.cursor = -1; gameShow.order = shuffle([...slides].map((_, idx) => idx).filter(idx => idx > 0 && slides[idx].dataset.full)); mode = 'photo'; stopGameShowCue(); setGameShowIntroText('Primary Flipcharts Presents', 'FILL IT IN!', getSongTitle()); document.body.classList.add('gameshow-active'); document.getElementById('slideshow').classList.add('photo-mode'); const intro = document.getElementById('gameshowIntro'); if (intro) { intro.classList.add('active'); intro.setAttribute('aria-hidden', 'false'); } updateSlideContent(); updateNav(); }
    function showGamePhoto() { const intro = document.getElementById('gameshowIntro'); if (intro) { intro.classList.remove('active'); intro.setAttribute('aria-hidden', 'true'); } gameShow.intro = false; gameShow.complete = false; gameShow.showingClue = false; gameShow.showingAnswer = false; stopGameShowCue(); mode = 'photo'; document.getElementById('slideshow').classList.add('photo-mode'); setActiveSlide(gameShow.order[gameShow.cursor]); updateSlideContent(); updateNav(); }
    function revealGameClue() { gameShow.showingClue = true; gameShow.showingAnswer = false; playGameShowCue('clue', { loop: true, volume: 0.16 }); mode = 'guess'; document.getElementById('slideshow').classList.remove('photo-mode'); updateSlideContent(); updateNav(); }
    function revealGameAnswer() { gameShow.showingAnswer = true; playGameShowCue('answer', { volume: 0.65 }); mode = 'full'; document.getElementById('slideshow').classList.remove('photo-mode'); updateSlideContent(); updateNav(); }
    function finishGameShow() { gameShow.complete = true; gameShow.intro = true; const intro = document.getElementById('gameshowIntro'); if (intro) { intro.classList.add('active'); intro.setAttribute('aria-hidden', 'false'); intro.querySelector('.gameshow-kicker').textContent = 'Game Complete'; intro.querySelector('.gameshow-logo').textContent = 'FILL IT IN!'; intro.querySelector('.gameshow-song').textContent = 'Back to beginning to play again'; playGameShowCue('complete'); } updateNav(); }
    function advanceGameShow() { if (gameShow.complete) { initGameShow(); return; } if (gameShow.intro && gameShow.cursor === -1) { gameShow.cursor = 0; showGamePhoto(); return; } if (!gameShow.showingClue) { revealGameClue(); return; } if (!gameShow.showingAnswer) { revealGameAnswer(); return; } gameShow.cursor += 1; if (gameShow.cursor >= gameShow.order.length) { finishGameShow(); return; } showGamePhoto(); }
    function updateNav() { const counter = document.getElementById('counter'); const prev = document.getElementById('prevBtn'); const next = document.getElementById('nextBtn'); const audio = document.getElementById('audioBtn'); if (audio) audio.classList.add('hidden'); if (gameShow.active) { prev.disabled = true; next.disabled = false; if (gameShow.complete) { counter.textContent = gameShow.order.length + ' / ' + gameShow.order.length; next.textContent = 'Play Again'; } else if (gameShow.intro) { counter.textContent = 'FILL IT IN!'; next.textContent = 'Start Game'; } else if (gameShow.showingAnswer) { counter.textContent = 'Answer ' + (gameShow.cursor + 1) + ' / ' + gameShow.order.length; next.textContent = gameShow.cursor === gameShow.order.length - 1 ? 'Finish' : 'Next Photo'; } else if (gameShow.showingClue) { counter.textContent = 'Clue ' + (gameShow.cursor + 1) + ' / ' + gameShow.order.length; next.textContent = 'Reveal Answer'; if (audio) audio.classList.remove('hidden'); } else { counter.textContent = 'Photo ' + (gameShow.cursor + 1) + ' / ' + gameShow.order.length; next.textContent = 'Reveal Clue'; } document.getElementById('progressBar').style.width = gameShow.intro ? '0%' : (((gameShow.cursor + 1) / gameShow.order.length) * 100) + '%'; return; } counter.textContent = (current + 1) + ' / ' + total; prev.disabled = current === 0; next.disabled = current === total - 1; next.textContent = next.textContent.includes('→') ? 'Next →' : 'Next'; document.getElementById('progressBar').style.width = ((current + 1) / total * 100) + '%'; }
    const modeOrder = ['full', 'guess', 'keywords', 'photo']; const modeIcons = {'full': '📝', 'guess': '❓', 'keywords': '🔑', 'photo': '📷'};
    function cycleMode() { const idx = modeOrder.indexOf(mode); mode = modeOrder[(idx + 1) % modeOrder.length]; const btn = document.getElementById('modeBtn'); if (btn) { btn.textContent = modeIcons[mode]; const label = mode === 'full' ? 'Lyrics' : mode === 'guess' ? 'Blanks' : mode === 'keywords' ? 'Keywords' : 'Pictures only'; btn.title = 'Mode: ' + label; btn.setAttribute('aria-label', 'Mode: ' + label); btn.classList.toggle('active', true); } document.getElementById('slideshow').classList.toggle('photo-mode', mode === 'photo'); updateSlideContent(); }
    function buildJumpNav() { const nav = document.getElementById('jumpNav'); const homeBtn = document.createElement('button'); homeBtn.className = 'jump-btn home-btn'; homeBtn.textContent = '↺'; homeBtn.title = 'Back to beginning'; homeBtn.setAttribute('aria-label', 'Back to beginning'); homeBtn.onclick = () => changeSlideAbsolute(0); nav.appendChild(homeBtn); const libBtn = document.createElement('button'); libBtn.className = 'jump-btn'; libBtn.textContent = '🎵'; libBtn.title = 'Song library'; libBtn.setAttribute('aria-label', 'Song library'); libBtn.onclick = () => window.location.href = '/index.html'; nav.appendChild(libBtn); }
    buildJumpNav(); let touchStartX = 0; document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive: true}); document.addEventListener('touchend', e => { const diff = touchStartX - e.changedTouches[0].clientX; if (Math.abs(diff) > 50) changeSlide(diff > 0 ? 1 : -1); }); document.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); changeSlide(1); } if (e.key === 'ArrowLeft') { e.preventDefault(); changeSlide(-1); } }); if (gameShow.active) initGameShow(); else { updateSlideContent(); updateNav(); }
