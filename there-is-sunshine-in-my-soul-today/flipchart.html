    <title>There Is Sunshine in My Soul Today - Primary Flipchart</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            font-family: Georgia, 'Times New Roman', serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .aspect-wrapper {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .screen {
            position: relative;
            width: min(100vw, 177.78vh);
            height: min(100vh, 56.25vw);
            background: linear-gradient(135deg, #14304a, #f2b84b);
            overflow: hidden;
        }

        .slideshow { width: 100%; height: 100%; position: relative; }

        .slide { display: none; position: absolute; inset: 0; }
        .slide.active { display: flex; flex-direction: column; }

        .slide-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: brightness(0.48) saturate(1.08);
            z-index: 0;
        }

        .slide-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px 60px 100px;
            text-align: center;
        }

        .slide-section {
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,232,150,0.78);
            margin-bottom: 24px;
        }

        .slide-line {
            font-size: clamp(1.8rem, 5.3vw, 3.25rem);
            font-weight: 700;
            color: #fffdf4;
            line-height: 1.5;
            text-shadow: 0 3px 25px rgba(0,0,0,0.9), 0 1px 8px rgba(0,0,0,1);
            max-width: 900px;
        }

        .slide-line.keywords {
            font-size: clamp(2.4rem, 7.6vw, 5rem);
            color: #ffe372;
            text-shadow: 0 4px 30px rgba(0,0,0,0.9);
        }

        .title-main {
            font-size: clamp(2.4rem, 6.6vw, 4.8rem);
            font-weight: bold;
            color: #fffdf4;
            text-shadow: 0 4px 30px rgba(0,0,0,0.9);
            margin-bottom: 16px;
            max-width: 1000px;
        }

        .title-sub {
            font-size: clamp(1rem, 2.5vw, 1.35rem);
            color: rgba(255,255,255,0.72);
            letter-spacing: 2px;
        }

        .nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(100vw, 177.78vh);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: rgba(0,0,0,0.52);
            backdrop-filter: blur(8px);
        }

        .nav-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            padding: 10px 32px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: Georgia, serif;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-btn:active { background: rgba(255,255,255,0.35); transform: scale(0.97); }
        .nav-btn:disabled { opacity: 0.25; cursor: default; }
        .nav-counter { color: rgba(255,255,255,0.65); font-size: 0.9rem; }

        .mode-toggle {
            position: fixed;
            top: 14px;
            right: calc(50% - min(50vw, 88.89vh) + 14px);
            z-index: 100;
            display: flex;
            gap: 8px;
        }

        .mode-btn {
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            width: 36px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
            border-radius: 20px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .mode-btn.active { background: #ffd34f; color: #1c1a0b; border-color: #ffd34f; font-weight: 600; }

        .jump-nav {
            position: fixed;
            top: 14px;
            left: calc(50% - min(50vw, 88.89vh) + 14px);
            z-index: 100;
            display: flex;
            gap: 6px;
        }

        .jump-btn {
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            width: 34px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
            border-radius: 20px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }

        .jump-btn:hover { background: rgba(255,255,255,0.2); }
        .jump-btn.home-btn { background: rgba(255,211,79,0.25); border-color: #ffd34f; color: #ffd34f; }


        /* iPad teaching controls */
        .jump-nav,
        .mode-toggle { opacity: 0.62; transition: opacity 0.2s ease; }
        .jump-nav:hover,
        .jump-nav:focus-within,
        .mode-toggle:hover,
        .mode-toggle:focus-within { opacity: 0.95; }
        .jump-btn,
        .mode-btn { touch-action: manipulation; }
        @media (pointer: coarse) {
            .jump-nav,
            .mode-toggle { opacity: 0.7; }
            .jump-btn { width: 40px; height: 36px; font-size: 1rem; }
            .mode-btn { width: 42px; height: 36px; font-size: 1rem; }
        }

        #slideshow.photo-mode .slide-line,
        #slideshow.photo-mode .slide-section,
        #slideshow.photo-mode .title-main,
        #slideshow.photo-mode .title-sub { opacity: 0 !important; transition: opacity 0.3s; }
        #slideshow.photo-mode .slide-bg { filter: brightness(0.88) saturate(1.12) !important; }

        .progress-bar {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 4px;
            background: #ffd34f;
            transition: width 0.3s ease;
            z-index: 200;
            max-width: min(100vw, 177.78vh);
        }

        @media (max-width: 768px) {
            .slide-content { padding: 30px 30px 90px; }
            .slide-line { font-size: clamp(1.45rem, 6.2vw, 2.45rem); }
            .nav-btn { padding: 10px 24px; font-size: 1rem; }
        }
    </style>

<div class="nav">
    <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)" disabled>Back</button>
    <span class="nav-counter" id="counter">1 / 33</span>
    <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">Next</button>

<script>
    let current = 0;
    let mode = 'full';
    const slides = document.querySelectorAll('.slide');
    const total = slides.length;

    function updateSlideContent() {
        slides.forEach(slide => {
            const el = slide.querySelector('.slide-line');
            if (!el) return;
            const full = slide.dataset.full;
            const key = slide.dataset.key;
            if (!full) return;

            if (mode === 'full') {
                el.classList.remove('keywords', 'guess-mode');
                el.innerHTML = full;
            } else if (mode === 'guess') {
                el.classList.remove('keywords');
                el.classList.add('guess-mode');
                const keyWords = new Set((key || '').toUpperCase().split(/[\s·]+/).filter(w => w.replace(/[^A-Z]/g,'').length > 2));
                const fullWords = full.split(' ');
                el.innerHTML = fullWords.map(w => {
                    const clean = w.replace(/[^a-zA-Z0-9']/g, '').toUpperCase();
                    const isKey = keyWords.has(clean);
                    if (isKey) {
                        const width = Math.max(clean.length * 16, 40);
                        return '<span style="display:inline-block;border-bottom:3px solid rgba(255,255,255,0.85);min-width:' + width + 'px;margin:0 3px;vertical-align:bottom;height:1.1em;"></span>';
                    }
                    return w;
                }).join(' ');
            } else if (mode === 'keywords') {
                el.classList.add('keywords');
                el.classList.remove('guess-mode');
                el.textContent = key || full;
            } else {
                el.classList.remove('keywords', 'guess-mode');
                el.innerHTML = full;
            }
        });
    }

    function changeSlide(dir) {
        slides[current].classList.remove('active');
        current = Math.max(0, Math.min(total - 1, current + dir));
        slides[current].classList.add('active');
        updateNav();
    }

    function changeSlideAbsolute(idx) {
        slides[current].classList.remove('active');
        current = idx;
        slides[current].classList.add('active');
        updateNav();
    }

    function updateNav() {
        document.getElementById('counter').textContent = `${current + 1} / ${total}`;
        document.getElementById('prevBtn').disabled = current === 0;
        document.getElementById('nextBtn').disabled = current === total - 1;
        document.getElementById('progressBar').style.width = `${((current + 1) / total) * 100}%`;
    }

    const modeOrder = ['full', 'guess', 'keywords', 'photo'];
    const modeIcons = {'full': '📝', 'guess': '❓', 'keywords': '🔑', 'photo': '📷'};
    function cycleMode() {
        const idx = modeOrder.indexOf(mode);
        mode = modeOrder[(idx + 1) % modeOrder.length];
        const btn = document.getElementById('modeBtn');
        if (btn) { btn.textContent = modeIcons[mode]; btn.title = `Mode: ${mode}`; btn.setAttribute('aria-label', `Mode: ${mode}`); btn.classList.toggle('active', true); }
        document.getElementById('slideshow').classList.toggle('photo-mode', mode === 'photo');
        updateSlideContent();
    }

    function buildJumpNav() {
        const nav = document.getElementById('jumpNav');
        const homeBtn = document.createElement('button');
        homeBtn.className = 'jump-btn home-btn';
        homeBtn.textContent = '↺';
        homeBtn.title = 'Back to beginning';
        homeBtn.setAttribute('aria-label', 'Back to beginning');
        homeBtn.onclick = () => changeSlideAbsolute(0);
        nav.appendChild(homeBtn);
        const libBtn = document.createElement('button');
        libBtn.className = 'jump-btn';
        libBtn.textContent = '🎵';
        libBtn.title = 'Song library';
        libBtn.setAttribute('aria-label', 'Song library');
        libBtn.onclick = () => window.location.href = '/index.html';
        nav.appendChild(libBtn);
    }

    buildJumpNav();

    let touchStartX = 0;
    document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive: true});
    document.addEventListener('touchend', e => {
        const diff = touchStartX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 50) changeSlide(diff > 0 ? 1 : -1);
    });

    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); changeSlide(1); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); changeSlide(-1); }
    });

    updateSlideContent();
    updateNav();
</script>
