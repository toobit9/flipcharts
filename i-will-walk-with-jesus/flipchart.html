    let current = 0, mode = 'full';
    const slides = document.querySelectorAll('.slide');
    const total = slides.length;
    const gameShow = { active: new URLSearchParams(window.location.search).get('mode') === 'gameshow', intro: false, complete: false, showingClue: false, showingAnswer: false, cursor: -1, order: [] };
    const gameShowAudioFiles = { start: '/david-and-goliath/audio/fill-it-in-david-and-goliath.mp3', clue: '/david-and-goliath/audio/fill-it-in-thinking.mp3', answer: '/david-and-goliath/audio/fill-it-in-answer.mp3', complete: '/david-and-goliath/audio/fill-it-in-answer.mp3' };
    let gameShowAudio = null;
    function updateSlideContent() { slides.forEach(slide => { const el = slide.querySelector('.slide-line'); if (!el) return; const full = slide.dataset.full; const key = slide.dataset.key; if (!full) return; if (mode === 'full') { el.classList.remove('keywords', 'guess-mode'); el.innerHTML = full; } else if (mode === 'guess') { el.classList.remove('keywords'); el.classList.add('guess-mode'); const keyWords = new Set((key || '').toUpperCase().split(/[\s·]+/).filter(w => w.replace(/[^A-Z]/g,'').length > 2)); el.innerHTML = full.split(' ').map(w => { const clean = w.replace(/[^a-zA-Z0-9']/g, '').toUpperCase(); if (keyWords.has(clean)) { const width = Math.max(clean.length * 16, 40); return '<span style="display:inline-block;border-bottom:3px solid rgba(255,255,255,0.85);min-width:' + width + 'px;margin:0 3px;vertical-align:bottom;height:1.1em;"></span>'; } return w; }).join(' '); } else if (mode === 'keywords') { el.classList.add('keywords'); el.classList.remove('guess-mode'); el.textContent = key || full; } else { el.classList.remove('keywords', 'guess-mode'); el.innerHTML = full; } }); }

    function setGameShowIntroText(kicker, logo, song) { const intro = document.getElementById('gameshowIntro'); if (!intro) return; intro.querySelector('.gameshow-kicker').textContent = kicker; intro.querySelector('.gameshow-logo').textContent = logo; intro.querySelector('.gameshow-song').textContent = song; }

    function showGamePhoto() { const intro = document.getElementById('gameshowIntro'); if (intro) { intro.classList.remove('active'); intro.setAttribute('aria-hidden', 'true'); } gameShow.intro = false; gameShow.complete = false; gameShow.showingClue = false; gameShow.showingAnswer = false; stopGameShowCue(); mode = 'photo'; document.getElementById('slideshow').classList.add('photo-mode'); setActiveSlide(gameShow.order[gameShow.cursor]); updateSlideContent(); updateNav(); }
    function revealGameClue() { gameShow.showingClue = true; gameShow.showingAnswer = false; playGameShowCue('clue', { loop: true, volume: 0.16 }); mode = 'guess'; document.getElementById('slideshow').classList.remove('photo-mode'); updateSlideContent(); updateNav(); }

    function updateNav() { const counter = document.getElementById('counter'); const prev = document.getElementById('prevBtn'); const next = document.getElementById('nextBtn'); const audio = document.getElementById('audioBtn'); if (audio) audio.classList.add('hidden'); if (gameShow.active) { prev.disabled = true; next.disabled = false; if (gameShow.complete) { counter.textContent = gameShow.order.length + ' / ' + gameShow.order.length; next.textContent = 'Play Again'; } else if (gameShow.intro) { counter.textContent = 'FILL IT IN!'; next.textContent = 'Start Game'; } else if (gameShow.showingAnswer) { counter.textContent = 'Answer ' + (gameShow.cursor + 1) + ' / ' + gameShow.order.length; next.textContent = gameShow.cursor === gameShow.order.length - 1 ? 'Finish' : 'Next Photo'; } else if (gameShow.showingClue) { counter.textContent = 'Clue ' + (gameShow.cursor + 1) + ' / ' + gameShow.order.length; next.textContent = 'Reveal Answer'; if (audio) audio.classList.remove('hidden'); } else { counter.textContent = 'Photo ' + (gameShow.cursor + 1) + ' / ' + gameShow.order.length; next.textContent = 'Reveal Clue'; } document.getElementById('progressBar').style.width = gameShow.intro ? '0%' : (((gameShow.cursor + 1) / gameShow.order.length) * 100) + '%'; return; } counter.textContent = (current + 1) + ' / ' + total; prev.disabled = current === 0; next.disabled = current === total - 1; next.textContent = next.textContent.includes('→') ? 'Next →' : 'Next'; document.getElementById('progressBar').style.width = ((current + 1) / total * 100) + '%'; }
    const modeOrder = ['full', 'guess', 'keywords', 'photo']; const modeIcons = {'full': '📝', 'guess': '❓', 'keywords': '🔑', 'photo': '📷'};
    function cycleMode() { const idx = modeOrder.indexOf(mode); mode = modeOrder[(idx + 1) % modeOrder.length]; const btn = document.getElementById('modeBtn'); if (btn) { btn.textContent = modeIcons[mode]; btn.title = 'Mode: ' + mode; btn.setAttribute('aria-label', 'Mode: ' + mode); btn.classList.toggle('active', true); } document.getElementById('slideshow').classList.toggle('photo-mode', mode === 'photo'); updateSlideContent(); }
    function buildJumpNav() { const nav = document.getElementById('jumpNav'); const homeBtn = document.createElement('button'); homeBtn.className = 'jump-btn home-btn'; homeBtn.textContent = '↺'; homeBtn.title = 'Back to beginning'; homeBtn.setAttribute('aria-label', 'Back to beginning'); homeBtn.onclick = () => changeSlideAbsolute(0); nav.appendChild(homeBtn); const libBtn = document.createElement('button'); libBtn.className = 'jump-btn'; libBtn.textContent = '🎵'; libBtn.title = 'Song library'; libBtn.setAttribute('aria-label', 'Song library'); libBtn.onclick = () => window.location.href = '/index.html'; nav.appendChild(libBtn); }
    buildJumpNav(); let touchStartX = 0; document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive: true}); document.addEventListener('touchend', e => { const diff = touchStartX - e.changedTouches[0].clientX; if (Math.abs(diff) > 50) changeSlide(diff > 0 ? 1 : -1); }); document.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); changeSlide(1); } if (e.key === 'ArrowLeft') { e.preventDefault(); changeSlide(-1); } }); if (gameShow.active) initGameShow(); else { updateSlideContent(); updateNav(); }
</script></body></html>
