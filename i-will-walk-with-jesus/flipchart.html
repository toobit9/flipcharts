color:#fffdf7;text-shadow:0 4px 30px #000;margin-bottom:16px;max-width:1100px}.slide[data-type="title"] .slide-content{align-items:center;text-align:center}.title-sub{font-size:clamp(.95rem,2.1vw,1.35rem);color:rgba(255,255,255,.76);letter-spacing:1px;text-shadow:0 2px 14px #000}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,177.78vh);z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:rgba(0,0,0,.52);backdrop-filter:blur(8px)}.nav-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:white;padding:10px 32px;border-radius:30px;font-size:1.1rem;cursor:pointer;font-family:Georgia,serif;-webkit-tap-highlight-color:transparent}.nav-btn:active{background:rgba(255,255,255,.35);transform:scale(.97)}.nav-btn:disabled{opacity:.25}.nav-counter{color:rgba(255,255,255,.65);font-size:.9rem}.mode-toggle{position:fixed;top:14px;right:calc(50% - min(50vw,88.89vh) + 14px);z-index:100}.mode-btn,.jump-btn{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.3);color:white;width:36px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:20px;font-size:.95rem;cursor:pointer;-webkit-tap-highlight-color:transparent}.mode-btn.active{background:var(--accent);color:#15120a;border-color:var(--accent);font-weight:600}.jump-nav{position:fixed;top:14px;left:calc(50% - min(50vw,88.89vh) + 14px);z-index:100;display:flex;gap:6px}.jump-btn.home-btn{background:rgba(255,255,255,.15);border-color:var(--accent);color:var(--accent)}.jump-nav,.mode-toggle{opacity:.62;transition:opacity .2s}.jump-nav:hover,.jump-nav:focus-within,.mode-toggle:hover,.mode-toggle:focus-within{opacity:.95}@media(pointer:coarse){.jump-nav,.mode-toggle{opacity:.7}.jump-btn{width:40px;height:36px;font-size:1rem}.mode-btn{width:42px;height:36px;font-size:1rem}}#slideshow.photo-mode .slide-line,#slideshow.photo-mode .slide-section,#slideshow.photo-mode .title-main,#sli f(mode==='keywords'){el.classList.add('keywords');el.classList.remove('guess-mode');el.textContent=key||full}else{el.classList.remove('keywords','guess-mode');el.innerHTML=full}})}function changeSlide(dir){slides[current].classList.remove('active');current=Math.max(0,Math.min(total-1,current+dir));slides[current].classList.add('active');updateNav()}function changeSlideAbsolute(idx){slides[current].classList.remove('active');current=idx;slides[current].classList.add('active');updateNav()}function updateNav(){document.getElementById('counter').textContent=`${current+1} / ${total}`;document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=current===total-1;document.getElementById('progressBar').style.width=`${(current+1)/total*100}%`}const modeOrder=['full','guess','keywords','photo'],modeIcons={full:'📝',guess:'❓',keywords:'🔑',photo:'📷'};function cycleMode(){mode=modeOrder[(modeOrder.indexOf(mode)+1)%modeOrder.length];const btn=document.getElementById('modeBtn');btn.textContent=modeIcons[mode];btn.title=`Mode: ${mode}`;btn.setAttribute('aria-label',`Mode: ${mode}`);document.getElementById('slideshow').classList.toggle('photo-mode',mode==='photo');updateSlideContent()}function buildJumpNav(){const nav=document.getElementById('jumpNav');const homeBtn=document.createElement('button');homeBtn.className='jump-btn home-btn';homeBtn.textContent='↺';homeBtn.title='Back to beginning';homeBtn.setAttribute('aria-label','Back to beginning');homeBtn.onclick=()=>changeSlideAbsolute(0);nav.appendChild(homeBtn);const libBtn=document.createElement('button');libBtn.className='jump-btn';libBtn.textContent='🎵';libBtn.title='Song library';libBtn.setAttribute('aria-label','Song library');libBtn.onclick=()=>window.location.href='/index.html';nav.appendChild(libBtn)}buildJumpNav();let touchStartX=0;document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{const diff=touchStartX-e.changedTouches[0].clientX;if(Math.abs(diff)>50)changeSlide(diff>0?1:-1)});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();changeSlide(1)}if(e.key==='ArrowLeft'){e.preventDefault();changeSlide(-1)}});updateSlideContent();updateNav();</script></body></html>
